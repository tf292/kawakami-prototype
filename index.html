<!-- PWA: ホーム画面に追加してアプリとして使うための設定 -->
<link rel="manifest" href="assets/manifest.json" />
<meta name="theme-color" content="#0d2b36" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="川神" />

<title>川神プロトタイプ｜かわかみ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2b2a; --navy:#0d2b36; --navy2:#123a47; --navy3:#0a222b;
  --gold:#d9b45c; --gold2:#e6c878; --goldline:#c9a44a;
  --teal:#2e7d74; --river:#3d8fa8; --red:#b6503f;
  --water:#2f7fa8; --life:#5d9a4e; --res:#a4762a;
  --card:#fffdf4; --line:#d8cdb0; --muted:#6d7263;
  --panel-border:1.5px solid rgba(217,180,92,.85);
  /* stage scale: 1 design px = stage height / 810 (matches the 16:9 reference images on any device) */
  --k:min(0.12346vh,0.06944vw);
  --k:min(0.12346dvh,0.06944vw);
}
*{box-sizing:border-box} html,body{margin:0;padding:0;height:100%}
body{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);background:#07161d;overflow:hidden;display:flex;align-items:center;justify-content:center}
/* ---------- 16:9 fixed game stage (landscape only) ---------- */
#stage{position:relative;width:min(100vw,177.78vh);width:min(100vw,177.78dvh);height:min(100vh,56.25vw);height:min(100dvh,56.25vw);overflow:hidden;background:#dcebe4;flex:none}
#rotate{display:none;position:fixed;inset:0;z-index:300;background:linear-gradient(170deg,#123a47,#07161d);color:#f2ecd8;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#rotate .ric{font-size:52px;animation:rotpulse 2.2s ease-in-out infinite}
@keyframes rotpulse{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
@media(prefers-reduced-motion:reduce){#rotate .ric{animation:none}}
#rotate .rt{font-family:"Shippori Mincho",serif;font-size:26px;font-weight:800;letter-spacing:.08em;color:#ffe9a8}
#rotate .rs{font-size:14px;line-height:1.9;color:#c8d4bd}
@media(orientation:portrait){#rotate{display:flex}}
button,[role="button"],select,summary{ min-height:36px; }
button{font-family:inherit;cursor:pointer}
h1,h2,h3,.mincho{font-family:"Shippori Mincho",serif}
.wrap{position:absolute;inset:0;overflow:hidden}
.wrap.wide{position:absolute;inset:0;overflow:hidden}
img.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* ---------- generic panels (care/party/setting on watercolor) ---------- */
.page-bg{position:relative;height:100%;overflow-y:auto;overflow-x:hidden;padding:calc(var(--k)*14) calc(var(--k)*14) calc(var(--k)*92);background:#e9f1e4 url('assets/bg-tree.jpg') center/cover}
.page-bg::before{content:"";position:absolute;inset:0;background:rgba(244,248,238,.72)}
.page-bg>*{position:relative}
.topbar{display:flex;flex-wrap:wrap;gap:calc(var(--k)*10);align-items:stretch;justify-content:space-between;margin-bottom:calc(var(--k)*12)}
.datebox{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#f2ecd8;border-radius:calc(var(--k)*10);padding:calc(var(--k)*9) calc(var(--k)*18);border:var(--panel-border);box-shadow:0 3px calc(var(--k)*10) rgba(6,30,38,.35)}
.datebox .big{font-family:"Shippori Mincho",serif;font-size:calc(var(--k)*21);font-weight:800;letter-spacing:.04em}
.datebox .sub{font-size:calc(var(--k)*12);color:var(--gold2)}
.turnbar{flex:1;min-width:calc(var(--k)*200);background:rgba(13,43,54,.92);border:var(--panel-border);border-radius:calc(var(--k)*10);padding:calc(var(--k)*9) calc(var(--k)*14);color:#e9e2c8}
.turnbar .lbl{font-size:calc(var(--k)*12);color:#c8d4bd;display:flex;justify-content:space-between}
.meter{height:calc(var(--k)*10);background:rgba(255,255,255,.16);border-radius:calc(var(--k)*99);overflow:hidden;margin-top:calc(var(--k)*6)}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:calc(var(--k)*99)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--k)*14);padding:calc(var(--k)*16);margin-bottom:calc(var(--k)*14);box-shadow:0 2px calc(var(--k)*10) rgba(60,60,30,.08)}
.panel.dark{background:linear-gradient(165deg,var(--navy2),var(--navy3));color:#f0ead2;border:var(--panel-border)}
.panel.dark .muted{color:#b9c4ae}
.sec-title{font-family:"Shippori Mincho",serif;font-size:calc(var(--k)*20);font-weight:800;margin:0 0 calc(var(--k)*4);display:flex;align-items:center;gap:calc(var(--k)*8)}
.sec-title::before{content:"";width:calc(var(--k)*8);height:calc(var(--k)*22);background:var(--gold);border-radius:3px;display:inline-block}
.muted{color:var(--muted);font-size:calc(var(--k)*13);line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--k)*14)}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
/* god select */
.godcards{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--k)*14)}
@media(max-width:760px){.godcards{grid-template-columns:1fr}}
.godcard{border:2px solid var(--line);border-radius:calc(var(--k)*16);padding:calc(var(--k)*16);background:var(--card);text-align:left;width:100%}
.godcard:hover{border-color:var(--gold)}
.godface-art{display:flex;justify-content:center;padding:calc(var(--k)*8) calc(var(--k)*8) 2px;border-radius:calc(var(--k)*12);margin-bottom:calc(var(--k)*8)}
.godcard-img{width:100%;height:calc(var(--k)*168);object-fit:cover;object-position:top center;border-radius:calc(var(--k)*10);display:block}
.kv-banner{width:100%;height:17vw;max-height:calc(var(--k)*248);object-fit:cover;object-position:center 30%;display:block;border-radius:calc(var(--k)*12);margin-bottom:calc(var(--k)*12);border:1px solid rgba(230,200,120,.5)}
.godname{font-family:"Shippori Mincho",serif;font-size:calc(var(--k)*22);font-weight:800;text-align:center}
.godrole{text-align:center;font-size:calc(var(--k)*12);font-weight:700;letter-spacing:.08em;margin:calc(var(--k)*4) 0 calc(var(--k)*8)}
/* chips & buttons */
.chip{display:inline-block;font-size:calc(var(--k)*11);font-weight:700;border-radius:calc(var(--k)*99);padding:2px calc(var(--k)*9);margin:2px calc(var(--k)*4) 2px 0;background:#ece4c8;color:#5c543a}
.chip.w{ background:#dceef5;color:#1f5b74}.chip.l{background:#e4efd6;color:#40642a}.chip.r{background:#f3e6c8;color:#7a5a16}
.chip.ok{background:#d9ecd2;color:#2f6423}.chip.ng{background:#f3d9d2;color:#8c3527}
.btn{border:1px solid #0e2a29;background:var(--navy);color:#f5efdb;border-radius:calc(var(--k)*10);padding:calc(var(--k)*10) calc(var(--k)*18);font-weight:700;font-size:calc(var(--k)*15)}
.btn.gold{background:linear-gradient(180deg,#e3c169,#c39a3e);color:#2c2410;border-color:#8a6d24}
.btn.ghost{background:#fffefa;color:var(--ink);border-color:var(--line)}
.btn.red{background:var(--red);border-color:#7e3527}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:calc(var(--k)*7) calc(var(--k)*12);font-size:calc(var(--k)*13);min-height:36px}
.row{display:flex;flex-wrap:wrap;gap:calc(var(--k)*8);align-items:center}
.spread{justify-content:space-between}
.itemcard{border:1px solid var(--line);border-radius:calc(var(--k)*12);padding:calc(var(--k)*13) calc(var(--k)*14);background:#fffefa;margin-bottom:calc(var(--k)*10)}
.itemcard.locked{opacity:.62;background:#efe9d6}
.itemcard h3{margin:0 0 calc(var(--k)*4);font-size:calc(var(--k)*16);font-family:"Shippori Mincho",serif}
.mats{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--k)*8)}
@media(min-width:761px){.mats{grid-template-columns:repeat(5,1fr)}}
.mat{background:#f6f1de;border:1px solid var(--line);border-radius:calc(var(--k)*10);padding:calc(var(--k)*8);text-align:center;font-size:calc(var(--k)*13)}
.mat b{display:block;font-size:calc(var(--k)*18);font-family:"Shippori Mincho",serif}
.mat.zero{opacity:.45}
.kv{font-size:calc(var(--k)*13);line-height:1.9}
details.help{background:#fffefa;border:1px solid var(--line);border-radius:calc(var(--k)*12);padding:calc(var(--k)*12) calc(var(--k)*14);margin-bottom:calc(var(--k)*14)}
details.help summary{font-weight:900;cursor:pointer;padding:calc(var(--k)*4) 0}
.prog{font-size:calc(var(--k)*12);color:var(--muted)}
select{font-family:inherit;font-size:calc(var(--k)*15);padding:calc(var(--k)*8);border-radius:calc(var(--k)*8);border:1px solid var(--line);background:#fffefa}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#ffe9a8;padding:11px 20px;border-radius:99px;font-weight:700;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw;text-align:center;border:var(--panel-border)}
.hidden{display:none!important}
/* bottom nav (inside stage) */
.bottomnav{position:absolute;left:0;right:0;bottom:0;background:rgba(10,34,43,.97);padding:calc(var(--k)*8) calc(var(--k)*10);z-index:50;box-shadow:0 -calc(var(--k)*4) calc(var(--k)*18) rgba(0,0,0,.3);border-top:1.5px solid rgba(217,180,92,.6)}
.bottomnav .in{max-width:calc(var(--k)*1060);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--k)*8)}
.navbtn{background:rgba(255,255,255,.04);border:1px solid rgba(230,207,138,.45);color:#e9e2c8;border-radius:calc(var(--k)*10);padding:calc(var(--k)*8) calc(var(--k)*4);font-size:calc(var(--k)*13);font-weight:700}
.navbtn.on{background:linear-gradient(180deg,#e3c169,#c39a3e);color:#2c2410;border-color:var(--gold)}
.navbtn .ic{display:block;font-size:calc(var(--k)*16);line-height:1.2}
/* ---------- gauges (home / tree side panel) ---------- */
.gauge{display:grid;grid-template-columns:calc(var(--k)*40) 1fr calc(var(--k)*36);align-items:center;gap:calc(var(--k)*8);margin:calc(var(--k)*6) 0;font-size:calc(var(--k)*13)}
.gauge .gl{font-weight:700}
.gauge .gtrack{height:calc(var(--k)*13);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:calc(var(--k)*99);overflow:hidden}
.gauge .gtrack>i{display:block;height:100%;border-radius:calc(var(--k)*99)}
.gauge .gv{font-family:"Shippori Mincho",serif;font-weight:800;text-align:right;font-size:calc(var(--k)*15)}
.g-hp>i{background:linear-gradient(90deg,#f2705c,#ef5350)} .g-mp>i{background:linear-gradient(90deg,#6db3e8,#4a90d9)}
.g-atk>i{background:linear-gradient(90deg,#f5a94b,#ef8f2e)} .g-def>i{background:linear-gradient(90deg,#9ccc8a,#6faf57)}
.g-spd>i{background:linear-gradient(90deg,#f6dd6b,#eec93f)}
/* ---------- HOME scene ---------- */
.scene{position:relative;height:100%;overflow:hidden}
.date-chip{position:absolute;top:calc(var(--k)*14);left:calc(var(--k)*14);z-index:5;background:linear-gradient(180deg,var(--navy2),var(--navy3));color:#fff;border:var(--panel-border);border-radius:calc(var(--k)*10);padding:calc(var(--k)*10) calc(var(--k)*22);font-family:"Shippori Mincho",serif;font-size:clamp(calc(var(--k)*17),2.6vw,calc(var(--k)*24));font-weight:800;letter-spacing:.05em;box-shadow:0 calc(var(--k)*4) calc(var(--k)*14) rgba(6,30,38,.4)}
.speech{position:absolute;top:calc(var(--k)*86);right:calc(var(--k)*16);z-index:5;width:min(calc(var(--k)*430),58vw);background:linear-gradient(180deg,#fffbe9,#fdf3d3);border:1.5px solid #d9c07a;border-radius:calc(var(--k)*14);padding:calc(var(--k)*14) calc(var(--k)*18);font-size:calc(var(--k)*14);line-height:1.75;color:#3d3423;box-shadow:0 calc(var(--k)*6) calc(var(--k)*18) rgba(60,50,20,.25)}
.speech::after{content:"✦";position:absolute;left:50%;bottom:-calc(var(--k)*15);transform:translateX(-50%);color:#d9b45c;font-size:calc(var(--k)*15);text-shadow:0 1px 0 #fff}
.speech b{font-size:calc(var(--k)*15)}
.home-god{position:absolute;right:2.5%;bottom:calc(var(--k)*52);z-index:4;width:min(calc(var(--k)*252),34vw);text-align:center;filter:drop-shadow(0 calc(var(--k)*10) calc(var(--k)*10) rgba(20,50,30,.35))}
.home-god.framed-god{bottom:calc(var(--k)*116);width:min(calc(var(--k)*216),32vw)}
.home-god img.god-full-img{width:100%;height:auto;display:block}
.home-god img.god-full-img.framed{border-radius:calc(var(--k)*16);border:2.5px solid rgba(230,200,120,.9);box-shadow:0 calc(var(--k)*10) calc(var(--k)*24) rgba(6,30,38,.45)}
.home-god .god-nameplate{display:inline-block;margin-top:-calc(var(--k)*8);background:linear-gradient(180deg,var(--navy2),var(--navy3));color:#ffe9a8;border:var(--panel-border);border-radius:calc(var(--k)*8);padding:3px calc(var(--k)*16);font-family:"Shippori Mincho",serif;font-weight:800;font-size:calc(var(--k)*15)}
.status-panel{position:absolute;left:calc(var(--k)*14);bottom:calc(var(--k)*14);z-index:5;width:min(calc(var(--k)*302),52vw);background:linear-gradient(170deg,rgba(18,58,71,.96),rgba(10,34,43,.97));color:#f2ecd8;border:var(--panel-border);border-radius:calc(var(--k)*14);padding:calc(var(--k)*16) calc(var(--k)*18) calc(var(--k)*15);box-shadow:0 calc(var(--k)*8) calc(var(--k)*22) rgba(6,30,38,.45)}
.status-panel .sp-title{font-family:"Shippori Mincho",serif;color:var(--gold2);font-size:calc(var(--k)*20);font-weight:800;letter-spacing:.06em}
.status-panel .sp-pts{font-size:calc(var(--k)*16.5);margin:calc(var(--k)*6) 0 2px}
.status-panel .sp-pts b{font-family:"Shippori Mincho",serif;font-size:calc(var(--k)*17.5)}
.status-panel hr{border:none;border-top:1px solid rgba(230,200,120,.4);margin:calc(var(--k)*9) 0}
.status-panel .sp-sub{font-size:calc(var(--k)*11);color:#b9c4ae;margin-bottom:calc(var(--k)*4)}
.cmd-bar{position:absolute;left:calc(var(--k)*592);right:calc(var(--k)*14);bottom:calc(var(--k)*14);z-index:6;display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--k)*10);background:rgba(10,34,43,.88);border:var(--panel-border);border-radius:calc(var(--k)*14);padding:calc(var(--k)*11);box-shadow:0 calc(var(--k)*10) calc(var(--k)*26) rgba(6,30,38,.5)}
.cmd-btn{background:linear-gradient(180deg,#17424f,#0d2b36);border:1.5px solid rgba(230,200,120,.75);color:#fff;border-radius:calc(var(--k)*10);padding:calc(var(--k)*16) calc(var(--k)*4);font-family:"Shippori Mincho",serif;font-size:clamp(calc(var(--k)*15),2.2vw,calc(var(--k)*21));font-weight:800;letter-spacing:.08em;min-height:max(44px,calc(var(--k)*70))}
.cmd-btn:hover{background:linear-gradient(180deg,#1d5062,#123a47);border-color:var(--gold2)}
.cmd-btn small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:calc(var(--k)*10);font-weight:700;color:var(--gold2);letter-spacing:.14em;margin-top:2px}
@media(max-height:500px){
  .speech{top:calc(var(--k)*62);width:min(calc(var(--k)*340),46%);font-size:calc(var(--k)*12.5);padding:calc(var(--k)*10) calc(var(--k)*13);line-height:1.6}
  .home-god{bottom:calc(var(--k)*46);width:calc(var(--k)*178);right:1.5%}
  .home-god.framed-god{bottom:calc(var(--k)*100);width:calc(var(--k)*152)}
  .status-panel{width:calc(var(--k)*278);padding:calc(var(--k)*10) calc(var(--k)*13) calc(var(--k)*9)}
  .status-panel .sp-title{font-size:calc(var(--k)*16)}
  .gauge{margin:2.5px 0;font-size:calc(var(--k)*12)}
  .cmd-bar{left:calc(var(--k)*540);gap:calc(var(--k)*6);padding:calc(var(--k)*7)}
  .cmd-btn{padding:calc(var(--k)*9) 2px;min-height:46px;font-size:calc(var(--k)*15)}
  .date-chip{font-size:calc(var(--k)*17);padding:calc(var(--k)*7) calc(var(--k)*16)}

/* party */
.party-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--k)*14)}
@media(max-width:760px){.party-grid{grid-template-columns:1fr}}
.party-card{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--k)*14);padding:calc(var(--k)*14);text-align:center}

/* ---------- TREE screens ---------- */
.tree-scene{position:relative;height:100%;overflow:hidden}
.tree-scene .tree-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.side-panel{background:linear-gradient(170deg,rgba(18,58,71,.97),rgba(10,34,43,.98));color:#f2ecd8;border:var(--panel-border);border-radius:calc(var(--k)*14);padding:calc(var(--k)*14) calc(var(--k)*16);box-shadow:0 calc(var(--k)*8) calc(var(--k)*22) rgba(6,30,38,.45);overflow-y:auto;min-height:0}

/* ============ 斜め4方向ドット絵スプライト（戦いの構え） ============
   戦闘画面はアイソメ（斜め）視点なので、絵も画面の斜め方向を向いた4パターンを
   全ユニット分 assets/spr-<key>-<dir>.png に用意する。
   dir は facingDir() が「世界の向き＋カメラ回転」から求めた画面上の向きで、
   アイソメ投影では盤面の4方向は画面の斜め4方向に一致する：
     f = 手前左（画面左下向き・正面寄りの3/4ビュー）
     r = 手前右（画面右下向き・正面寄りの3/4ビュー）
     l = 奥左　（画面左上向き・背面寄りの3/4ビュー）
     b = 奥右　（画面右上向き・背面寄りの3/4ビュー）
   u.faceDir は移動・攻撃・回復のたびに setFacing で更新される（既存の face=絵文字とは別物）。 */
function spriteKey(u){ if(u.god) return G.god; return u.art || "ayu"; }
function facingDir(u){
  var f = u.faceDir || (u.side==="e" ? [0,1] : [0,-1]);
  var r = (typeof B!=="undefined" && B) ? (B.rot||0) : 0;
  var fx=f[0], fy=f[1], rx, ry;
  if(r===1){ rx=-fy; ry=fx; } else if(r===2){ rx=-fx; ry=-fy; } else if(r===3){ rx=fy; ry=-fx; } else { rx=fx; ry=fy; }
  if(rx===1) return "r"; if(rx===-1) return "l"; if(ry===1) return "f"; return "b";
}
function setFacing(u, tx, ty){ var dx=tx-u.x, dy=ty-u.y; if(!dx&&!dy) return; if(Math.abs(dx)>=Math.abs(dy)) u.faceDir=[dx>0?1:-1,0]; else u.faceDir=[0,dy>0?1:-1]; }
function setFacingDelta(u, dx, dy){ if(!dx&&!dy) return; if(Math.abs(dx)>=Math.abs(dy)) u.faceDir=[dx>0?1:-1,0]; else u.faceDir=[0,dy>0?1:-1]; }
function unitArt(u, dirOverride){
  var d = dirOverride || facingDir(u);
  return '<img class="u-img-pix" src="assets/spr-'+spriteKey(u)+'-'+d+'.png" alt="'+esc(u.name)+'">';
}

   解放状態だけをリセットし、ポイント・素材・ターン・パラメータツリー等の

var SAVE_VER = 2;

  if(!G) return;

}
function clearSave(){

}
function loadSave(){
  try{
    var raw=localStorage.getItem(SAVE_KEY); if(!raw) return null;
    var d=JSON.parse(raw); if(!d||!d.state||!GODS[d.state.god]) return null;
    var s=d.state;

    var care=[]; for(var i=0;i<9;i++){ care.push((s.careCounts&&typeof s.careCounts[i]==="number"&&s.careCounts[i]>=0)?Math.floor(s.careCounts[i]):0); }
    var num=function(v,def,min,max){ return (typeof v==="number"&&isFinite(v))?Math.min(max,Math.max(min,Math.floor(v))):def; };
    var g={ god:s.god,
      turn:num(s.turn,1,1,51),

      mats:mats, careCounts:care,
      /* 移行：v1（15項目時代）のセーブはインデックスの意味が変わるため、共通ツリーの
         解放状態だけを空に戻す。ステータスは calcStats が新しい6項目から再計算する */
      common:(d.v>=2&&Array.isArray(s.common)?s.common.filter(function(x){return typeof x==="number"&&x>=0&&x<COMMON.length;}):[]),
      tree:{ water:num(s.tree&&s.tree.water,0,0,14), life:num(s.tree&&s.tree.life,0,0,14), res:num(s.tree&&s.tree.res,0,0,14) },
      skills:(Array.isArray(s.skills)?s.skills.filter(function(x){return typeof x==="string";}):[]),
      evo:num(s.evo,0,0,2),
      cleared:(s.cleared&&typeof s.cleared==="object")?s.cleared:{},
      battles:num(s.battles,0,0,9999), wins:num(s.wins,0,0,9999),
      finished:!!s.finished, lastResult:(typeof s.lastResult==="string")?s.lastResult:"" };
    return g;
  }catch(e){ return null; }
}
function saveInfoText(){
  try{
    var raw=localStorage.getItem(SAVE_KEY); if(!raw) return "保存データはありません。";
    var d=JSON.parse(raw); if(!d||!d.state||!GODS[d.state.god]) return "保存データはありません。";
    var when=d.savedAt?new Date(d.savedAt).toLocaleString("ja-JP"):"日時不明";

function calcStats(){
  var st={hp:60,mp:10,atk:12,def:10,spd:10};
  G.common.forEach(function(i){ var fx=COMMON[i].fx; for(var k in fx) st[k]+=fx[k]; });
  PARAMS.forEach(function(p){ for(var s=0;s<G.tree[p.id];s++){ var fx=TREE_FX[p.id][s]; for(var k in fx) st[k]+=fx[k]; } });
  st.hp=Math.min(255,st.hp); st.mp=Math.min(99,st.mp); st.atk=Math.min(99,st.atk); st.def=Math.min(99,st.def); st.spd=Math.min(99,st.spd);
  return st;
}
function monthWeek(){ var starts=[1,5,9,13,17,21,26,30,34,38,42,46]; var t=Math.max(1,Math.min(50,G.turn)); var m=1; for(var i=0;i<starts.length;i++){ if(t>=starts[i]) m=i+1; } var w=t-starts[m-1]+1; return m+"月 第"+w+"週（"+G.turn+"ターン目）"; }

function careUnlocked(i){
  if(i<3) return true;
  if(i<6) return G.evo>=1;
  return G.careCounts[3]>=1 && G.careCounts[4]>=1 && G.careCounts[5]>=1;
}
function canAfford(cost){ for(var m in cost){ if(G.mats[m]<cost[m]) return false; } return true; }
function costStr(cost){ return Object.keys(cost).map(function(m){ var ok=G&&G.mats[m]>=cost[m]; return '<span class="chip '+(ok?"ok":"ng")+'">'+MAT_ICON[m]+m+"×"+cost[m]+"</span>"; }).join(""); }
function lootStr(loot){ return Object.keys(loot).map(function(m){ return '<span class="chip">'+MAT_ICON[m]+m+"×"+loot[m]+"</span>"; }).join(""); }
function stageUnlocked(s){ if(s===0) return true; for(var d=0;d<4;d++){ if(G.cleared[(s-1)+"-"+d]) return true; } return false; }
function depthUnlocked(s,d){ if(d===0) return true; return !!G.cleared[s+"-"+(d-1)]; }
function allyList(){

    {name:"お供アユ", art:"ayu", hp:48+G.evo*10, atk:13+G.evo*3, def:8+G.evo*2, spd:14, move:4, note:"素早い川魚。通常攻撃のみ。"},
    {name:"お供ドジョウ", art:"dojou", hp:72+G.evo*12, atk:10+G.evo*3, def:13+G.evo*2, spd:8, move:3, note:"丈夫な泥の守り手。通常攻撃のみ。"}
  ];

<script>
"use strict";
/* ============ 技の解放条件 ============ */
function skillKey(cat,idx){ return cat+":"+idx; }
function hasSkill(cat,idx){ return G.skills.indexOf(skillKey(cat,idx))>=0; }
function skillReqText(cat,idx){
  var sk=SKILLS[G.god][cat][idx];
  if(cat==="comp"){ var need = sk.cs===1?8:14; return sk.pair.map(function(p){return paramName(p)+"解放数 "+unlockCount(p)+"/"+need;}).join(" ・ "); }
  var stg=STG[idx];
  if(stg===1) return "共通ツリー解放数 "+G.common.length+"/3";
  return paramName(cat)+"解放数 "+unlockCount(cat)+"/"+STG_REQ[stg];
}
function skillAvailable(cat,idx){
  if(hasSkill(cat,idx)) return false;
  var sk=SKILLS[G.god][cat][idx];
  if(cat==="comp"){
    var need = sk.cs===1?8:14;
    if(!(unlockCount(sk.pair[0])>=need && unlockCount(sk.pair[1])>=need)) return false;
    if(sk.cs===2){ var first = SKILLS[G.god].comp.findIndex(function(c){return c.pair===sk.pair && c.cs===1;}); if(!hasSkill("comp",first)) return false; }
    return true;
  }
  var stg=STG[idx];
  if(stg===1){ if(G.common.length<3) return false; }
  else if(unlockCount(cat)<STG_REQ[stg]) return false;
  var pre=PRE[idx];
  if(pre!==null && !hasSkill(cat,pre)) return false;
  return true;
}
function skillVisible(cat,idx){
  if(hasSkill(cat,idx)||skillAvailable(cat,idx)) return true;
  var sk=SKILLS[G.god][cat][idx];
  if(cat==="comp"){ return false; }
  var pre=PRE[idx];
  if(pre!==null && !hasSkill(cat,pre) && !skillAvailable(cat,pre)) return false;
  if(pre===null || hasSkill(cat,pre) || skillAvailable(cat,pre)) return true;
  return false;
}
function paramName(id){ return {water:"水量",life:"生命",res:"資源"}[id]; }
function learnedSkills(){ var out=[]; ["water","life","res","comp"].forEach(function(cat){ SKILLS[G.god][cat].forEach(function(sk,idx){ if(hasSkill(cat,idx)) out.push({cat:cat,idx:idx,sk:sk}); }); }); return out; }
function canEvo1(){ return G.evo===0 && G.common.length>=COMMON.length; }
function evo2Status(){
  var anyFull = G.tree.water>=14||G.tree.life>=14||G.tree.res>=14;
  var totalTree = G.tree.water+G.tree.life+G.tree.res;
  return {anyFull:anyFull, totalTree:totalTree, need:24, ok: G.evo===1 && anyFull && totalTree>=24};
}
function fxStr(fx){ var m={hp:"HP",mp:"神力",atk:"攻撃",def:"防御",spd:"素早さ"}; return Object.keys(fx).filter(function(k){return fx[k]>0;}).map(function(k){return m[k]+"+"+fx[k];}).join("・"); }
function rangeLabel(sk){
  if(sk.r==="s") return "単体（射程"+sk.rng+"）";
  if(sk.r==="self") return "周囲"+sk.rng+"マス";
  if(sk.r==="line") return sk.rng>=8?"前方直線全体":"前方直線"+sk.rng+"マス";
  if(sk.r==="area") return "指定マス中心3×3";
  return "全体";
}
function paramName2(k){ return {atk:"攻撃",def:"防御",spd:"素早さ",hp:"HP",mp:"神力"}[k]||k; }
function skillDesc(sk){
  var d="";
  if(sk.k==="d") d="威力"+sk.v+"%の攻撃";
  else if(sk.k==="h") d="回復（"+(sk.v>=60?"大":sk.v>=35?"中":"小")+"回復）";
  else if(sk.k==="dh") d="威力"+sk.v+"%の攻撃＋回復";
  else if(sk.k==="rev") d="倒れた味方をHP"+sk.v+"%で蘇生";
  else if(sk.k==="hb") d="回復＋バフ";
  else if(sk.k==="b") d="バフ";
  if(sk.hits) d+="（"+sk.hits+"回）";
  if(sk.revive && sk.k==="h") d+="＋倒れた味方をHP"+sk.revive+"%で蘇生";
  if(sk.hot) d+="＋次の巡も回復";
  if(sk.shield) d+="｜被ダメージ-"+sk.shield+"%";
  if(sk.buff) d+="｜"+Object.keys(sk.buff).map(function(k){return paramName2(k)+"+"+sk.buff[k]+"%";}).join("・");
  if(sk.debuff) d+="｜敵の"+Object.keys(sk.debuff).map(function(k){return paramName2(k)+sk.debuff[k]+"%";}).join("・");
  if(sk.pull) d+="｜引き寄せ"; if(sk.push) d+="｜押し出し";
  if(sk.selfDef) d+="｜使用後1巡 自分の防御"+sk.selfDef+"%";
  return d;
}

/* ---------- PWA: 全画面で遊ぶための案内（タイトル画面のみ・消去可） ---------- */
var pwaHintDismissed=false;
function isStandalone(){

    if(window.navigator && window.navigator.standalone) return true;

function fsAvailable(){ var el=document.documentElement; return !!(el.requestFullscreen||el.webkitRequestFullscreen); }

function bindPwaHint(){
  var x=document.getElementById("pwa-hint-x");
  if(x) x.addEventListener("click", function(){ pwaHintDismissed=true; var h=document.getElementById("pwa-hint"); if(h) h.remove(); });
  var f=document.getElementById("pwa-fs");
  if(f) f.addEventListener("click", function(){
    var el=document.documentElement; var fn=el.requestFullscreen||el.webkitRequestFullscreen;
    if(fn){ try{ var p=fn.call(el); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  });
}

   +'<div class="cr-gain"><div class="cg-t">獲得！</div><div class="cr-boxes">'+boxes+'</div></div>'

   +'<div class="cr-row"><span class="cr-lbl">ポイント変化：</span>'+chips+'</div>'
   +'<button class="cr-go" id="btn-carecont">つづける</button></div></div>';

var careAnimRAF=null;
var CARE_IMG={};
function careImg(src){
  if(!(src in CARE_IMG)){ var im=new Image(); im.src=src; CARE_IMG[src]=im; }
  return CARE_IMG[src];
}
function careFrameSrc(spot, f){ return "assets/care-dot-"+(spot+1)+"-f"+f+".png"; }
function startCareAnim(){
  var cv=$("care-canvas"); if(!cv||!careResult) return;
  var ctx=cv.getContext("2d");
  ctx.imageSmoothingEnabled=false;
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var dur = reduced?900:3400;
  var frames=[1,2,3].map(function(f){ return careImg(careFrameSrc(careResult.i, f)); });
  var t0=null;
  function draw(fi){
    ctx.fillStyle="#79a86b"; ctx.fillRect(0,0,cv.width,cv.height);
    var im=frames[fi];
    if(im.complete && im.naturalWidth) ctx.drawImage(im,0,0,cv.width,cv.height);
  }
  function frame(now){
    if(t0===null) t0=now;
    var el=now-t0, p=Math.min(1, el/dur);
    /* 作業中は1・2コマ目を約0.28秒ごとに交互表示し、終盤（78%〜）は
       3コマ目（完了の絵）で止める。絵そのものがフレーム違いなので、
       キャラのポーズ・水車の角度・片付き具合がコマごとに変わる。 */
    var fi = p>=0.78 ? 2 : (Math.floor(el/280)%2);
    draw(fi);
    if(el<dur){ careAnimRAF=requestAnimationFrame(frame); }
    else { careAnimRAF=null; finishCareAnim(); }
  }
  /* 1コマ目を読み込んでから再生を始める（読み込み失敗でも演出は止めない） */
  var started=false;
  function begin(){ if(started) return; started=true; careAnimRAF=requestAnimationFrame(frame); }
  if(frames[0].complete && frames[0].naturalWidth) begin();
  else {
    frames[0].addEventListener("load", begin);
    frames[0].addEventListener("error", begin);
    setTimeout(begin, 900);
  }
}
function finishCareAnim(){
  if(careAnimRAF){ cancelAnimationFrame(careAnimRAF); careAnimRAF=null; }
  if(view!=="careanim"||!careResult) return;
  view="careresult"; render();
}
function drawCareResultBg(){
  var cv=$("care-result-canvas"); if(!cv||!careResult) return;
  var ctx=cv.getContext("2d");
  ctx.imageSmoothingEnabled=false;
  var im=careImg(careFrameSrc(careResult.i, 3));
  function paint(){ if(im.complete && im.naturalWidth) ctx.drawImage(im,0,0,cv.width,cv.height); }
  if(im.complete && im.naturalWidth) paint();
  else im.addEventListener("load", paint);
}

function smoothPath(pts){

  });

  var e2=evo2Status();
  var capState = G.evo>=2 ? "done" : (e2.ok ? "avail" : "locked");
  html+=tnodeHtml({x:PARAM_CAP[0], y:PARAM_CAP[1], cls:"gold", state:capState,
    icon: G.evo>=2?"🔓":"🔒", label:"進化ロック解除", sub: G.evo>=2?"第2進化 到達":(e2.ok?"解放できます":"方向の最後まで＋一定数で解放"),
    attrs: e2.ok?'data-evo="2"':""});
  html+='<div class="tnode gold done" style="left:'+PARAM_START[0]+'%;top:'+PARAM_START[1]+'%"><span class="nc" style="width:calc(var(--k)*34);height:calc(var(--k)*34);font-size:calc(var(--k)*11)">起点</span></div>';
  return '<div class="tree-canvas">'+html+'</div>';
}

function skillCanvas(){
  var paths="";
  ["water","life","res"].forEach(function(cat){
    var col=SKILL_LINE[cat];
    function edge(p0,p1,strong){
      var d=skillEdgePath(cat,p0,p1);
      var inner = cat==="life" ? "rgba(130,225,150,.40)" : (cat==="water" ? "rgba(210,240,255,.35)" : "rgba(255,230,190,.30)");
      paths+='<path d="'+d+'" fill="none" stroke="rgba('+col+","+(strong?0.55:0.30)+')" stroke-width="'+(cat==="life"?14:13)+'" stroke-linecap="round"/>';
      paths+='<path d="'+d+'" fill="none" stroke="'+inner+'" stroke-width="'+(cat==="life"?6:4)+'" stroke-linecap="round"/>';
    }
    edge([SKILL_ROOT[0],SKILL_ROOT[1]-60], SKILL_POS[cat][0], hasSkill(cat,0));
    for(var idx=1;idx<9;idx++){ var pre=SKILL_EDGE[cat][idx]; edge(SKILL_POS[cat][pre], SKILL_POS[cat][idx], hasSkill(cat,pre)&&hasSkill(cat,idx)); }
  });
  for(var ci=0;ci<3;ci++){ var a=SKILL_COMBO_POS[ci*2], b=SKILL_COMBO_POS[ci*2+1];

<script>
"use strict";
/* ============ 戦闘（SRPG） ============ */
var B=null;
/* ============ 盤面定数（11×14・縦長） ============
   x: 0..10（横）、y: 0..13（奥行き。0=奥／敵側、13=手前／味方側）。
   旧7×10盤面を各辺2マスずつ拡張したもの：旧地形・高さ・配置は全体を
   +2マスずらして内側にそのまま移し、周囲の新しい輪は広域風景画
   （15×18マス分）のその場所の絵に合わせて地形・高さを決めた。
   盤面サイズに依存する処理はすべてこの定数経由にし、描画・地形・配置・
   タップ吸着・移動/AIの範囲計算が同じ前提で動くようにする。
   アイソメ投影（縦圧縮0.40は従来どおり）：
     セル左端% = (x - y + ROWS-1) * ISO_SX、セル上端% = (x + y) * ISO_SY + ISO_TOP

var ISO_SX=100/(COLS+ROWS);           /* 4.0 */
var ISO_SY=3.76, ISO_TOP=3;
function tIdx(x,y){ return y*COLS+x; }
function inBoard(x,y){ return x>=0&&x<COLS&&y>=0&&y<ROWS; }

   川底が最も低く、両岸→斜面→高台へ段階的に上がる。岩場は侵入不可）。
   段差ルール：隣接マス間の高さ差が maxStep（7）を超える（＝差8以上）マスへは
   直接移動できない＝崖。プレイヤーの移動範囲計算と敵AIの経路探索の両方に同じく適用。
   戦闘への影響：Δ＝攻撃側の高さ−対象の高さ として
     命中率 ＝ hitBase + Δ×hitPer（=90+Δ×1、hitMin〜hitMax に制限。回復・蘇生は必中）
     ダメージ倍率 ＝ 1 + Δ×dmgPer（=1+Δ×0.01、dmgMin〜dmgMax に制限。previewDamage の入口で適用）
   回転：B.rot が 0〜3（90°刻み）。論理盤面は変えず表示投影だけを回す。 */
var HEIGHT_CFG={ hitBase:90, hitPer:1, hitMin:60, hitMax:100, dmgPer:0.01, dmgMin:0.7, dmgMax:1.3, maxStep:7 };

   判定は「攻撃される側の向き」基準：攻撃者が対象の正面側にいれば front、

   previewDamage の入口（高さ倍率と同じ場所）で適用し、予測表示と実計算を一致させる。

var FACE_DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
var FACE_NAMES={"0,-1":"北（奥）","1,0":"東","0,1":"南（手前）","-1,0":"西"};
function faceDirName(f){ return FACE_NAMES[(f||[0,-1]).join(",")]||"北（奥）"; }
function facingRelation(src,tgt){

function facingDmgMult(src,tgt){ return FACING_CFG[facingRelation(src,tgt)]; }
function facingLabel(src,tgt){ var r=facingRelation(src,tgt); return r==="back"?"背面 +30%":(r==="side"?"側面 +15%":"正面"); }

function screenDegForDir(f){
  var r=boardRot(); var fx=f[0], fy=f[1], rx, ry;
  if(r===1){ rx=-fy; ry=fx; } else if(r===2){ rx=-fx; ry=-fy; } else if(r===3){ rx=fy; ry=-fx; } else { rx=fx; ry=fy; }

function dirArrowChar(f){
  var r=boardRot(); var fx=f[0], fy=f[1], rx, ry;
  if(r===1){ rx=-fy; ry=fx; } else if(r===2){ rx=-fx; ry=-fy; } else if(r===3){ rx=fy; ry=-fx; } else { rx=fx; ry=fy; }
  var sdx=rx-ry, sdy=(rx+ry)*0.47;

  var best=null, bd=Infinity;
  B.allies.forEach(function(a){ if(!a.alive) return; var d=dist(e,a); if(d<bd){ bd=d; best=a; } });

/* ---- 回転つき投影：論理(x,y) → 表示グリッド(rx,ry) と盤面%座標 ---- */
function boardRot(){ return B ? (B.rot||0) : 0; }
function rotXY(x,y){ var r=boardRot();
  if(r===1) return [ROWS-1-y, x, ROWS, COLS];
  if(r===2) return [COLS-1-x, ROWS-1-y, COLS, ROWS];
  if(r===3) return [y, COLS-1-x, ROWS, COLS];
  return [x, y, COLS, ROWS]; }
function unrotXY(rx,ry){ var r=boardRot();
  if(r===1) return [ry, ROWS-1-rx];
  if(r===2) return [COLS-1-rx, ROWS-1-ry];
  if(r===3) return [COLS-1-ry, rx];

/* マスの表示位置は高さに応じて上下させる：高いマスは実際に持ち上がり、川（低）は沈む。
   ELEV_PCT = 高さ1あたり盤面高の何%持ち上げるか。ユニット・タップ吸着・FX・
   カメラの中心計算はすべて cellLeftTop/cellCenter 経由なので、この1か所で全て連動する。 */
var ELEV_PCT=0.55;
function cellLeftTop(x,y){ var p=rotXY(x,y); var rx=p[0], ry=p[1], RD=p[3]; var h=heightAt(x,y);
  return { left:(rx-ry+RD-1)*ISO_SX, top:(rx+ry)*ISO_SY+ISO_TOP - h*ELEV_PCT, z:(rx+ry)*10 + 5, h:h }; }
function cellCenter(x,y){ var lt=cellLeftTop(x,y); return { cx:lt.left+ISO_SX, cy:lt.top+ISO_SY }; }
/* ============ カメラ（センタリング／ズーム／パン） ============
   .cam-world への translate/scale で実現する。状態は CAM に持ち、renderBattle の
   再描画をまたいで保持する（戦闘開始時に startBattle がリセット）。
   センタリングは「行動者が切り替わったとき」だけ行い、プレイヤーが手動で

var CAM={z:1, tx:0, ty:0, zMin:0.5, suppressTapUntil:0, centerReq:false};
var lastCenteredCur=null;
function camEls(){ return { stage:document.querySelector(".b-stage"), world:document.querySelector(".cam-world"), board:document.querySelector(".iso-board") }; }
function clampCam(){
  var e=camEls(); if(!e.stage||!e.board) return;
  var vw=e.stage.clientWidth, vh=e.stage.clientHeight;
  /* ズームアウトの下限は「盤外の景色（盤面の2倍の広さ）全体が見える」所まで */
  CAM.zMin=Math.min(vw/(e.board.offsetWidth*2), vh/(e.board.offsetHeight*2))*0.94;
  if(CAM.z<CAM.zMin) CAM.z=CAM.zMin;

  /* パンの可動範囲も盤面ではなく盤外の景色の範囲（盤面の上下左右に各50%ずつ）に合わせる */
  var bl=e.board.offsetLeft-e.board.offsetWidth*0.5-24, bt=e.board.offsetTop-e.board.offsetHeight*0.5-24, br=bl+e.board.offsetWidth*2+48, bb=bt+e.board.offsetHeight*2+48;
  function clampAxis(t, vsize, c0, c1){
    var span=(c1-c0)*CAM.z;
    if(span<=vsize) return (vsize-span)/2 - c0*CAM.z;

  e.world.style.transform = "translate("+CAM.tx+"px,"+CAM.ty+"px) scale("+CAM.z+")";

}
function centerCameraOn(x,y,animate){
  var e=camEls(); if(!e.stage||!e.board) return;
  var c=cellCenter(x,y);
  var wx=e.board.offsetLeft + c.cx/100*e.board.offsetWidth;
  var wy=e.board.offsetTop + c.cy/100*e.board.offsetHeight;
  CAM.tx=e.stage.clientWidth/2 - wx*CAM.z;
  CAM.ty=e.stage.clientHeight/2 - wy*CAM.z;

}
/* 全体表示：盤面（11×14）＋周囲の景色（盤面の2倍の広さ＝森の帯まで）が
   一画面に収まるズームとセンタリングにする。フィットの基準矩形は盤面を
   中心に上下左右へ各50%広がった範囲で、回転しても外形は変わらないため、
   どの向きでも同じ計算で全体が収まる。地面SVG自体はこの矩形より広く
   描かれていて（viewBox -265 -300 1000 800）、フィット表示で基準矩形の
   外が画面に入っても、隅まで森の絵で覆われる。
   戦闘開始直後（CAM.fitPending）と「全体を表示」ボタンから使う。 */
function fitCameraToBoard(animate){
  var e=camEls(); if(!e.stage||!e.board) return;
  var vw=e.stage.clientWidth, vh=e.stage.clientHeight;
  if(!vw||!vh||!e.board.offsetWidth) return;
  var bw=e.board.offsetWidth, bh=e.board.offsetHeight;
  var cx=e.board.offsetLeft + bw/2, cy=e.board.offsetTop + bh/2;

   最後にタップしたマス（B.focus）→ 行動中のキャラ（B.cur）の順で決める。 */
function selectionCell(){
  if(B&&B.sel) return {x:B.sel.x, y:B.sel.y};
  if(B&&B.focus) return {x:B.focus.x, y:B.focus.y};
  if(B&&B.cur) return {x:B.cur.x, y:B.cur.y};

/* 論理マス → 現在のカメラ変換でのステージ内 px 座標（中心計算の共通処理） */
function cellScreenPx(cx, cy){
  var e=camEls(); if(!e.stage||!e.board) return null;
  var c=cellCenter(cx, cy);
  return { x:(e.board.offsetLeft + c.cx/100*e.board.offsetWidth)*CAM.z + CAM.tx,

/* ============ 回転軸（画面中央）用の座標変換 ============
   回転ボタンは「今画面中央に映っている地点」を軸にする（ズーム軸＝選択地点
   とは独立）。画面中央のステージpx → 盤面% → 表示グリッド（小数）→
   論理グリッド（小数）へ逆変換した地点を保持し、回転後の投影でその地点の
   盤面%を再計算して、ステージ中央に来るようカメラを合わせる。
   高さの持ち上がりは軸計算では無視する（地表平面で近似）。 */
function stageCenterLogical(){
  var e=camEls(); if(!e.stage||!e.board) return null;
  var vw=e.stage.clientWidth, vh=e.stage.clientHeight;
  var bx=((vw/2-CAM.tx)/CAM.z - e.board.offsetLeft)/e.board.offsetWidth*100;
  var by=((vh/2-CAM.ty)/CAM.z - e.board.offsetTop)/e.board.offsetHeight*100;

  var Q=(by-ISO_TOP-ISO_SY)/ISO_SY;  /* rx + ry */
  var rx=(P+Q)/2, ry=(Q-P)/2, r=boardRot(), x, y;

  else if(r===2){ x=(COLS-1)-rx; y=(ROWS-1)-ry; }
  else if(r===3){ x=(COLS-1)-ry; y=rx; }
  else { x=rx; y=ry; }

}
function logicalCenterPct(lx, ly){
  var r=boardRot(), rx, ry;
  if(r===1){ rx=(ROWS-1)-ly; ry=lx; }
  else if(r===2){ rx=(COLS-1)-lx; ry=(ROWS-1)-ly; }
  else if(r===3){ rx=ly; ry=(COLS-1)-lx; }
  else { rx=lx; ry=ly; }

   高さによる持ち上がり・カメラのズーム／回転／パンをすべて含んだ最終位置から、

function positionMenu(){

  var u=B.sel;

  var mw=menu.offsetWidth, mh=menu.offsetHeight;

  var art=cellEl?cellEl.querySelector(".unit .u-art img, .unit .u-art svg"):null;

function healUnit(src,tgt,pct,skill){

  if(!tgt.alive){ if(skill&&skill.revive){ tgt.alive=true; tgt.hp=Math.max(1,Math.round(tgt.maxhp*skill.revive/100)); fxPush({t:"heal",x:tgt.x,y:tgt.y,amt:"蘇生！",revive:true}); blog("✨ "+tgt.name+" が HP"+tgt.hp+" で蘇生！"); } return; }

}
function applyBuffsTo(u,skill){

  if(skill.shield){ addBuff(u,{stat:"shield",pct:skill.shield,turns:skill.bt||1}); }
}
function pullUnit(src,tgt){ var dx=Math.sign(src.x-tgt.x), dy=Math.sign(src.y-tgt.y); var nx=tgt.x, ny=tgt.y; if(Math.abs(src.x-tgt.x)>=Math.abs(src.y-tgt.y)) nx+=dx; else ny+=dy; if(inBoard(nx,ny)&&!isBlockedTile(nx,ny)&&!unitAt(nx,ny)){ fxPush({t:"slide",fx:tgt.x,fy:tgt.y,x:nx,y:ny}); setFacingDelta(tgt,nx-tgt.x,ny-tgt.y); tgt.x=nx; tgt.y=ny; blog(tgt.name+" を引き寄せた"); } }
function pushUnit(src,tgt){ var dx=Math.sign(tgt.x-src.x), dy=Math.sign(tgt.y-src.y); var nx=tgt.x, ny=tgt.y; if(Math.abs(tgt.x-src.x)>=Math.abs(tgt.y-src.y)) nx+=dx; else ny+=dy; if(dx===0&&dy===0) nx+=1; if(inBoard(nx,ny)&&!isBlockedTile(nx,ny)&&!unitAt(nx,ny)){ fxPush({t:"slide",fx:tgt.x,fy:tgt.y,x:nx,y:ny}); setFacingDelta(tgt,nx-tgt.x,ny-tgt.y); tgt.x=nx; tgt.y=ny; blog(tgt.name+" を押し出した"); } }
function isBlockedTile(x,y){ return TERRAIN[tIdx(x,y)]==="rock"; }
function moveDistances(u){ var seen={}; seen[u.x+","+u.y]=0; var q=[[u.x,u.y,0]];
  while(q.length){ var cur=q.shift(); var cx=cur[0],cy=cur[1],d=cur[2]; if(d>=u.move) continue;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(o){ var nx=cx+o[0],ny=cy+o[1]; if(!inBoard(nx,ny)) return; var k=nx+","+ny; if(seen[k]!==undefined) return; if(isBlockedTile(nx,ny)) return; if(!canStep(cx,cy,nx,ny)) return; /* 高さ差8以上のマス（崖）へは直接移動できない */ if(unitAt(nx,ny)) return; seen[k]=d+1; q.push([nx,ny,d+1]); });
  } return seen; }
function moveTargets(u){ var seen=moveDistances(u); return Object.keys(seen).filter(function(k){ return seen[k]>0; }); }
function selectUnit(u){
  if(B.over||u.acted||!u.alive) return;
  if(B.cur&&u!==B.cur) return; /* 個別ターン制：操作できるのは行動順が回ってきた本人のみ */
  B.sel=u; B.focusUnit=u; B.moved=false; B.preMove=null; B.actionSpent=false; B.mode="action"; B.targets=[]; B.showSkills=false; B.confirm=null; B.focus={x:u.x,y:u.y}; renderBattle();
}
/* 行動の流れ（コマンド起点）：
   mode="action"（移動前）…メニューは「移動／攻撃／技／待機」。盤面タップでは移動しない。
   「移動」ボタン → mode="move"：メニューは消え、移動範囲だけが出る。
   移動先タップ → 移動し、mode="action"（移動後）に戻る。メニューは「攻撃／技／待機／キャンセル」。
   「キャンセル」→ undoMove で移動前の位置と移動前メニューに戻り、移動し直せる。
   自分のマスをタップした場合は移動を取りやめて移動前メニューに戻る（移動は消費しない）。 */
function startMove(){
  var u=B.sel; if(!u||B.moved) return;
  B.mode="move"; B.targets=moveTargets(u); B.showSkills=false; B.confirm=null; B.pendingSkill=null; B.predict=null; renderBattle();
}
function cancelMoveSelect(){ B.mode="action"; B.targets=[]; B.showSkills=false; renderBattle(); }
/* 右下固定「もどる」ボタンの統一処理：どのモードでも行動メニューへ戻す。
   - move（移動先の選択中）…移動せずに行動メニューへ（従来どおり）
   - target（攻撃／技の対象選択中）…対象選択を取りやめて行動メニューへ
     （移動済みなら B.moved／B.preMove は残るので、メニューから移動の巻き戻しもできる）
   - facing（待機の向き選択中）…向きを確定せずに行動メニューへ。
     攻撃／技の実行後（B.actionSpent）の場合は、メニュー側が「待機」だけに
     絞られるため、二重行動にはならない。 */
function unifiedBack(){
  if(!B||B.over||!B.sel) return;
  if(B.mode==="action" && B.showSkills){ B.showSkills=false; renderBattle(); return; }
  if(B.mode==="move"){ cancelMoveSelect(); return; }
  if(B.mode==="target"){
    B.mode="action"; B.pendingSkill=null; B.confirm=null; B.predict=null; B.showSkills=false; B.targets=[];
    renderBattle(); return;
  }
  if(B.mode==="facing"){
    B.mode="action"; B.targets=[];
    renderBattle(); return;
  }
}
function afterMove(){ B.mode="action"; B.targets=[]; B.showSkills=false; renderBattle(); }
/* キャンセル（移動の巻き戻し）：移動後の行動メニューでのみ使う。
   位置・向き・移動済みフラグをすべて移動前に戻し、移動前メニュー
   （移動を含む）へ戻る。神力は実行時にしか消費されないため、戻しても
   消費は発生しない。攻撃／技が実行された時点（executeSkill・通常攻撃の
   実行・向き選択への移行）で B.preMove は消えるため、その後は戻れない。
   ターン消費・バフの残り巡など、移動と無関係な状態には一切触れない。 */
function undoMove(){
  var u=B.sel; if(!u||!B.preMove) return;
  var px=B.preMove.x, py=B.preMove.y;
  fxPush({t:"slide",fx:u.x,fy:u.y,x:px,y:py});
  u.x=px; u.y=py;
  if(B.preMove.face) u.faceDir=B.preMove.face.slice(); /* 移動で変わった向きも移動前に戻す */
  B.preMove=null; B.moved=false;
  B.mode="action"; B.targets=[]; B.showSkills=false; B.confirm=null; B.pendingSkill=null; B.predict=null; B.focus={x:px,y:py};
  renderBattle();
}
function chooseAttack(){
  var u=B.sel; B.actFrom="action"; B.mode="target"; B.pendingSkill=null; B.predict=null; B.showSkills=false; /* B.preMove は残す：対象選択から「もどる」で行動メニューへ戻り、そこからキャンセルで移動を巻き戻せる */
  B.targets=B.foes.filter(function(f){ return f.alive&&dist(u,f)<=1; });
  if(!B.targets.length){ toast("隣接する敵がいません"); B.mode="action"; B.targets=[]; }
  renderBattle();
}
function chooseSkill(cat,idx){
  var u=B.sel; var sk=SKILLS[G.god][cat][idx];
  if(u.mp<sk.mp){ toast("神力が足りません"); return; }
  B.actFrom="action";
  B.pendingSkill={cat:cat,idx:idx,sk:sk}; B.showSkills=false; B.confirm=null; B.predict=null; /* B.preMove は残す：対象選択から「もどる」で行動メニューへ戻り、そこからキャンセルで移動を巻き戻せる */
  if(sk.r==="all"||sk.r==="self"){ executeSkill(null,null); return; }
  B.mode="target";
  if(sk.r==="s"){

    else if(sk.k==="rev") B.targets=B.allies.filter(function(a){return !a.alive;});

  } else if(sk.r==="area"){
    B.targets=[]; for(var x=0;x<COLS;x++)for(var y=0;y<ROWS;y++){ if(Math.abs(x-u.x)+Math.abs(y-u.y)<=sk.rng) B.targets.push({x:x,y:y,cell:true}); }
  }
  if(sk.r==="s"&&!B.targets.length){ toast("範囲内に目標がいません"); B.pendingSkill=null; B.mode="action"; B.targets=[]; }

}
function executeSkill(tx,ty){
  var u=B.sel; var ps=B.pendingSkill; var sk=ps.sk;

  B.confirm=null; B.predict=null;

    else if(sk.r==="area"){ targets=foesAlive().filter(function(f){return Math.abs(f.x-tx)<=1&&Math.abs(f.y-ty)<=1;}); }

/* ============ 行動順（全員混在・素早さ順の個別ターン制） ============
   各巡の開始時に生存する全ユニットを実効素早さの降順で並べた行動順表を確定する。
   同速は味方→敵、同じ陣営内は従来の並び順で決定的に処理する。
   素早さのバフ／デバフは確定済みの当巡の順表には影響せず、次巡の順表から反映する。
   バフ／デバフ／持続回復の残り巡の減少は、各ユニット自身のターン開始時に処理する。 */
function buildOrder(){
  var list=allUnits().filter(function(u){ return u.alive; });
  var dec=list.map(function(u,i){ return {u:u, i:i, spd:effStat(u,"spd")}; });
  dec.sort(function(a,b){
    if(b.spd!==a.spd) return b.spd-a.spd;
    if(a.u.side!==b.u.side) return a.u.side==="a"?-1:1;
    return a.i-b.i;
  });
  B.order=dec.map(function(d){ return d.u; });
  B.turnIdx=0;
}
/* 敵の対象選択（種類別）。どの分岐でも同条件（同距離・同HP割合）では
   B.allies の並び順で先に来る者を選び、毎回同じ結果になる決定的な選択にする。 */
function enemyPickTarget(e){
  var aliveAllies=B.allies.filter(function(a){return a.alive;});
  if(!aliveAllies.length) return null;
  if(e.role==="attacker"){ /* ブラックバス：神を優先（神が戦闘不能なら最寄りへ） */
    var god=null; aliveAllies.forEach(function(a){ if(a.god) god=a; });
    if(god) return god;
  }
  if(e.role==="fast"){ /* 外来ザリガニ：HP割合が最も低い味方（同割合なら並び順で先の者） */
    var low=null; aliveAllies.forEach(function(a){ if(!low||a.hp/a.maxhp<low.hp/low.maxhp) low=a; });
    return low;
  }
  var best=null, bd=Infinity;
  aliveAllies.forEach(function(a){ var d=dist(e,a); if(d<bd){ bd=d; best=a; } });
  return best;
}
/* ブルーギル（支援型）の回復対象：傷ついた仲間の敵。自分以外を優先し、
   同条件ならHP割合が最も低い者（同割合なら B.foes の並び順で先の者）。 */
function enemyHealTarget(e){
  var wounded=B.foes.filter(function(f){ return f.alive&&f.hp<f.maxhp; });
  if(!wounded.length) return null;
  var others=wounded.filter(function(f){ return f!==e; });
  var pool=others.length?others:wounded;
  var best=null;
  pool.forEach(function(f){ if(!best||f.hp/f.maxhp<best.hp/best.maxhp) best=f; });
  return best;
}
function enemyAct(e){
  if(e.role==="support"){ /* ブルーギル：回復を優先。回復対象がいなければ通常攻撃 */
    var ht=enemyHealTarget(e);
    if(ht){
      if(ht!==e) enemyMove(e,ht);
      if(dist(e,ht)<=1){ healUnit(e,ht,ENEMY_PROFILES.bluegill.healPct,null); if(ht===e) faceNearestAlly(e); return; }
      /* 回復対象に届かなかった場合は、その場で隣接する味方がいれば攻撃する（移動は二重に行わない） */
      var adj=null; B.allies.forEach(function(a){ if(!adj&&a.alive&&dist(e,a)<=1) adj=a; });
      if(adj) dealDamage(e,adj,100,null); else faceNearestAlly(e);
      return;
    }
  }
  var tgt=enemyPickTarget(e); if(!tgt) return;
  if(e.role==="defender") enemyMovePreferWater(e,tgt); else enemyMove(e,tgt);
  if(dist(e,tgt)<=1&&tgt.alive){
    var dd=dealDamage(e,tgt,100,null); /* 攻撃時は dealDamage 内で対象の方向を向く＝終了時の向きもその対象方向 */
    if(e.role==="push"&&dd>0&&tgt.alive) pushUnit(e,tgt); /* 大ナマズ：攻撃が当たったときだけ、既存の押し出し処理（岩・占有判定つき）を再利用 */
  } else {
    faceNearestAlly(e); /* 移動だけの場合は、最も近い味方の方向を向いてターンを終える */
  }
}
/* 行動順表に沿ってターンを進める。敵のターンはAIで即時実行し、次の味方のターンで止まる。
   味方のターンが来たら、そのユニットを選択状態にしてプレイヤー操作を待つ。 */
function processTurns(){
  if(!B||B.over) return;
  if(!B.foes.some(function(f){return f.alive;})) return;
  while(B.turnIdx<B.order.length){
    var u=B.order[B.turnIdx];
    if(!u.alive){ u.acted=true; B.turnIdx++; continue; }
    if(u.side==="e"){
      B.cur=u; B.focusUnit=u; u.turnSeq=(u.turnSeq||0)+1; startTurnEffects(u);
      if(u.alive&&!B.over) enemyAct(u);
      endTurnTicks(u);
      u.acted=true; B.turnIdx++;
      if(B.over){ B.cur=null; B.sel=null; return; }
      continue;
    }
    if(B.skipAllies){ blog(u.name+" は待機した"); u.turnSeq=(u.turnSeq||0)+1; startTurnEffects(u); endTurnTicks(u); u.acted=true; B.turnIdx++; continue; }
    B.cur=u; B.focusUnit=u; u.turnSeq=(u.turnSeq||0)+1; startTurnEffects(u);
    if(!u.alive){ u.acted=true; B.turnIdx++; continue; }
    if(B.over) return;
    B.sel=u; B.moved=false; B.preMove=null; B.actionSpent=false; B.mode="action"; B.targets=[]; B.showSkills=false; B.confirm=null; B.pendingSkill=null; B.focus={x:u.x,y:u.y};
    return;
  }
  /* 全員が行動し終えたら次の巡へ：順表を作り直す（素早さの増減はここから反映） */
  B.round++;
  B.skipAllies=false; B.cur=null; B.sel=null;
  allUnits().forEach(function(w){ w.acted=false; });
  blog("―― 第"+B.round+"巡 ――");
  buildOrder();
  processTurns();
}
function finishAction(){
  if(B.sel){ B.sel.acted=true; endTurnTicks(B.sel); }
  var cur=B.cur;
  B.sel=null; B.mode="select"; B.targets=[]; B.pendingSkill=null; B.showSkills=false; B.confirm=null; B.predict=null; B.preMove=null; B.actionSpent=false;
  if(B.over) return;
  if(!B.foes.some(function(f){return f.alive;})) return; /* 勝利判定は呼び出し側の endBattle に任せる */
  if(cur&&B.order[B.turnIdx]===cur) B.turnIdx++;
  B.cur=null;
  processTurns();
}
/* ============ ターン終了時の向き選択（プレイヤー操作ユニット専用） ============
   待機・通常攻撃・技のいずれでも、行動の最後にこの選択を挟む。
   初期選択は現在の向き。確定ボタンを押すまで finishAction は呼ばれず、ターンは進まない。
   敵のターンや「残りの味方全員 待機」の順送りは finishAction を直接使うため、ここには入らない。 */
function openFacingPicker(){
  var u=B.sel; if(!u){ finishAction(); return; }
  B.mode="facing"; B.targets=[]; B.pendingSkill=null; B.showSkills=false; B.confirm=null; B.predict=null; B.preMove=null;
  B.faceSel = u.faceDir ? u.faceDir.slice() : (u.side==="e"?[0,1]:[0,-1]);
}
function confirmFacing(){
  var u=B.sel; if(!u||B.mode!=="facing") return;
  if(B.faceSel) u.faceDir=B.faceSel.slice();
  blog(u.name+" は "+faceDirName(u.faceDir)+" を向いて待機した");
  finishAction();
  renderBattle();
}
function waitUnit(){ if(B.sel){ blog(B.sel.name+" は待機した"); openFacingPicker(); renderBattle(); } }
/* バフ／デバフ／持続効果の期間管理：
   - 持続回復の発動は、そのユニット自身のターン開始時。
   - 残り巡数の減算は、そのユニット自身のターン終了時。したがって「残り1巡」の効果は
     対象ユニットの次の行動の間も残り、その行動が終わるまでは消えない。
   - そのユニット自身の行動中に付けられた効果（自己バフ等）は、その行動の終了時には減算しない
     （addBuff が付与時点のターン番号 born を記録し、endTurnTicks は born が現在のターンと
      同じものを減算対象から外す）。 */
function addBuff(u,b){ b.born=(u.turnSeq||0); u.buffs.push(b); }
function startTurnEffects(u){
  if(!u.alive) return;
  u.buffs.forEach(function(b){
    if(b.stat==="hot"){ var amt=Math.round(u.maxhp*b.pct/100); var before=u.hp; u.hp=Math.min(u.maxhp,u.hp+amt); if(u.hp-before>0) fxPush({t:"heal",x:u.x,y:u.y,amt:u.hp-before}); blog("♨️ "+u.name+" は持続回復で "+amt+" 回復"); }
  });
}
function endTurnTicks(u){
  var kept=[];
  u.buffs.forEach(function(b){
    if(b.born!==undefined && b.born>=(u.turnSeq||0)){ kept.push(b); return; }
    b.turns--; if(b.turns>0) kept.push(b);
  });
  u.buffs=kept;
}
/* 敵の移動：目標セルからBFSで全マスへの最短距離表を作り、プレイヤー用BFS（moveDistances）で
   到達可能なマスの中から、その距離が最も小さくなるマスへ進む。岩や他ユニットで直進が塞がれていても、
   一時的に遠回りになる迂回路をたどって目標に隣接できる。目標選定・移動力・岩/占有ルールは従来どおり */
function enemyMove(e,tgt){
  if(dist(e,tgt)<=1) return;
  var dg={}; dg[tgt.x+","+tgt.y]=0; var q=[[tgt.x,tgt.y,0]];
  while(q.length){ var cur=q.shift(); var cx=cur[0], cy=cur[1], d=cur[2];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(o){ var nx=cx+o[0], ny=cy+o[1]; if(!inBoard(nx,ny)) return; var k=nx+","+ny; if(dg[k]!==undefined) return; if(isBlockedTile(nx,ny)) return; if(!canStep(cx,cy,nx,ny)) return; /* 段差制限はプレイヤーと同じ */ var occ=unitAt(nx,ny); if(occ&&occ!==e&&occ!==tgt) return; dg[k]=d+1; q.push([nx,ny,d+1]); });
  }
  var curKey=e.x+","+e.y; if(dg[curKey]===undefined) return;
  var reach=moveDistances(e); var bestKey=null, bestD=dg[curKey], bestSteps=-1;
  Object.keys(reach).forEach(function(k){ var dk=dg[k]; if(dk===undefined) return; if(dk<bestD||(dk===bestD&&bestKey&&reach[k]>bestSteps)){ bestD=dk; bestSteps=reach[k]; bestKey=k; } });
  if(bestKey){ var p=bestKey.split(","); var nx2=parseInt(p[0]), ny2=parseInt(p[1]); if(nx2!==e.x||ny2!==e.y){ fxPush({t:"slide",fx:e.x,fy:e.y,x:nx2,y:ny2}); setFacingDelta(e,nx2-e.x,ny2-e.y); } e.x=nx2; e.y=ny2; }
}
/* 外来ガメ（防御型）専用の行き先選択：enemyMove と同じ距離表（BFS）と到達可能マスを使い、
   行き先を選ぶ段階のスコアだけを変える（目標への距離が同じなら浅瀬のマスを優先する）。
   経路探索・迂回処理そのものには手を入れていない。浅瀬に乗れば地形の防御×1.15が
   ダメージ計算時に自動で重なる（補正はマス側に付く既存仕様）。 */
function enemyMovePreferWater(e,tgt){
  if(dist(e,tgt)<=1) return;
  var dg={}; dg[tgt.x+","+tgt.y]=0; var q=[[tgt.x,tgt.y,0]];
  while(q.length){ var cur=q.shift(); var cx=cur[0], cy=cur[1], d=cur[2];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(o){ var nx=cx+o[0], ny=cy+o[1]; if(!inBoard(nx,ny)) return; var k=nx+","+ny; if(dg[k]!==undefined) return; if(isBlockedTile(nx,ny)) return; if(!canStep(cx,cy,nx,ny)) return; /* 段差制限はプレイヤーと同じ */ var occ=unitAt(nx,ny); if(occ&&occ!==e&&occ!==tgt) return; dg[k]=d+1; q.push([nx,ny,d+1]); });
  }
  var curKey=e.x+","+e.y; if(dg[curKey]===undefined) return;
  var reach=moveDistances(e); var bestKey=null, bestD=dg[curKey], bestSteps=-1;
  var bestWater=terrainAt(e.x,e.y)==="water"?1:0;
  Object.keys(reach).forEach(function(k){ var dk=dg[k]; if(dk===undefined) return; var pp=k.split(","); var w=terrainAt(parseInt(pp[0]),parseInt(pp[1]))==="water"?1:0;
    if(dk<bestD||(dk===bestD&&(w>bestWater||(w===bestWater&&bestKey&&reach[k]>bestSteps)))){ bestD=dk; bestSteps=reach[k]; bestKey=k; bestWater=w; } });
  if(bestKey){ var p=bestKey.split(","); var nx3=parseInt(p[0]), ny3=parseInt(p[1]); if(nx3!==e.x||ny3!==e.y){ fxPush({t:"slide",fx:e.x,fy:e.y,x:nx3,y:ny3}); setFacingDelta(e,nx3-e.x,ny3-e.y); } e.x=nx3; e.y=ny3; }
}
/* 「残りの味方全員を待機させて順送り」：この巡にまだ行動していない味方は待機扱いにし、
   行動順表に沿って残りのターン（敵を含む）を進める。次巡からは通常どおり全員が行動できる。 */
function enemyPhase(){
  if(!B||B.over) return;
  B.skipAllies=true;
  blog("―― 残りの味方は待機し、行動順を進める ――");
  if(B.sel){ blog(B.sel.name+" は待機した"); finishAction(); } else { processTurns(); }
}
function endBattle(win){
  B.over=true;
  var loot=B.loot; var got={};
  Object.keys(loot).forEach(function(m){ got[m]= win?loot[m]:Math.floor(loot[m]/2); if(got[m]>0) G.mats[m]+=got[m]; });
  var gotStr=Object.keys(got).filter(function(m){return got[m]>0;}).map(function(m){return m+"×"+got[m];}).join("・")||"なし";
  if(win){ G.wins++; G.cleared[B.si+"-"+B.di]=true; }
  G.lastResult=(win?"探索に勝利":"探索は敗北")+"（"+STAGES[B.si].name+" 深度"+(B.di+1)+"）素材："+gotStr;
  blog(win?"🎉 <b>勝利！</b> 素材を手に入れた："+gotStr:"敗北…半分だけ持ち帰った："+gotStr);
  advanceTurn();
  renderBattle();
}
/* 撤退：報酬なしで戦闘を終了する。ターンの進行（advanceTurn）と、その後の
   帰還・自動保存の流れは通常の探索帰還（endBattle→結果パネル→拠点へ戻る）と同一。
   勝利数・踏破記録には数えない。 */
function retreatBattle(){
  B.over=true; B.retreated=true; B.retreatAsk=false;
  G.lastResult="探索から撤退（"+STAGES[B.si].name+" 深度"+(B.di+1)+"）素材：なし";
  blog("🚪 戦闘から<b>撤退</b>した（報酬なし）");
  advanceTurn();
  renderBattle();
}
function leaveBattle(){ B=null; view= G.finished?"ending":"explore"; render(); }
function terrainInfo(x,y){
  var t=TERRAIN[tIdx(x,y)]; var h=heightAt(x,y);
  if(t==="rock") return {name:"岩場", h:h, cost:"侵入不可", note:"オレンジ枠＋×のマスには入れません。補正なし"};
  if(t==="water") return {name:"浅瀬（川底）", h:h, cost:"移動コスト 1", note:"マップで最も低い場所（高さ-10前後）。防御補正あり：このマスのユニットは防御+15%（被ダメージが軽減されます）。味方・敵とも同じ。岸（高さ-3）との差は7以内なので出入りできます"};
  if(t==="high") return {name:"高台", h:h, cost:"移動コスト 1", note:"マップで最も高い場所（高さ+16前後）。高い所から攻撃すると命中・ダメージが上がります（高さ差1ごとに命中+1・ダメージ+1%）。急な側は崖（高さ差8以上）で直接は登れません"};
  return {name:"草地", h:h, cost:"移動コスト 1", note:"高さは場所で変わります（川岸-3／斜面+4／台地+9前後）。隣との高さ差が8以上のマスへは直接移動できません（崖）"};
}
/* ---- 左端の常設ステータス枠 ----
   表示対象は「最後にタップ／選択したキャラ」（B.focusUnit）。行動中キャラが
   切り替わったら processTurns／selectUnit がそちらを初期表示にする。
   行動フロー上のタップは従来どおり対象選択等を優先し、ここは表示専用：
   onCellTap が focusUnit を更新し、再描画を伴わないタップでも
   updateStatusPanel() で枠だけを書き換える。 */
function statusUnit(){
  if(!B) return null;
  var u=B.focusUnit;
  if(u && allUnits().indexOf(u)>=0) return u;
  if(B.cur) return B.cur;
  if(B.sel) return B.sel;
  return B.allies[0]||null;
}
function statusPanelHtml(){
  var u=statusUnit();
  var head='<div class="bsp-sec">ステータス</div>';
  if(!u) return head;
  var isEnemy=u.side==="e";
  var face=u.god
    ? '<img class="bsp-face god" src="'+GOD_FACE[G.god]+'" alt="">'
    : '<img class="bsp-face" src="assets/spr-'+spriteKey(u)+'-f.png" alt="">';
  var h=head+'<div class="bsp-head">'+face+'<div><div class="bsp-name">'+esc(u.name)+'</div>'
    +'<span class="bsp-tag '+(isEnemy?"e":"a")+'">'+(isEnemy?"敵":"味方")+(u.god?"・神":"")+'</span></div></div>';
  if(isEnemy && u.art && ENEMY_PROFILES[u.art]) h+='<div class="bsp-role">役割：'+ENEMY_PROFILES[u.art].label+'</div>';
  var hpPct=Math.max(0,Math.round(u.hp/u.maxhp*100));
  h+='<div class="bsp-bar-row"><span>HP</span><div class="bsp-bar hp"><i class="'+(u.hp/u.maxhp<0.3?"low":"")+'" style="width:'+hpPct+'%"></i></div><b>'+u.hp+' / '+u.maxhp+'</b></div>';
  if(!isEnemy && u.maxmp>0){
    h+='<div class="bsp-bar-row"><span>神力</span><div class="bsp-bar mp"><i style="width:'+Math.round(u.mp/u.maxmp*100)+'%"></i></div><b>'+u.mp+' / '+u.maxmp+'</b></div>';
  }
  function statRow(label,key){
    var eff=effStat(u,key), pct=buffPctSum(u,key);
    var note=pct?'<span class="bsp-delta '+(pct>0?"up":"dn")+'">('+(pct>0?"+":"")+pct+'%)</span>':"";
    return '<div class="bsp-stat"><span>'+label+'</span><b>'+eff+'</b>'+note+'</div>';
  }
  h+='<div class="bsp-stats">'+statRow("攻撃","atk")+statRow("防御","def")+statRow("素早さ","spd")+'</div>';
  var ti=terrainInfo(u.x,u.y);
  h+='<div class="bsp-terr">地形 <b>'+ti.name+'</b>（高さ <b>'+(ti.h>0?"+":"")+ti.h+'</b>）'
    +(terrainAt(u.x,u.y)==="water"?'<br>浅瀬の補正：防御+15%':"")+'</div>';
  if(u.buffs && u.buffs.length){
    var bl=u.buffs.map(function(b){
      var nm=b.stat==="hot"?"持続回復":(b.stat==="shield"?"シールド":paramName2(b.stat));
      var val=b.stat==="hot"?("毎巡 +"+b.pct+"%"):(b.stat==="shield"?(b.pct+"% 軽減"):((b.pct>0?"+":"")+b.pct+"%"));
      var de=(b.stat!=="shield"&&b.pct<0);
      return '<span class="bsp-buff'+(de?" de":"")+'">'+nm+" "+val+"・あと"+b.turns+"巡</span>";
    }).join("");
    h+='<div class="bsp-buffs">'+bl+'</div>';
  }
  if(!u.alive) h+='<div class="bsp-dead">戦闘不能</div>';
  return h;
}
function updateStatusPanel(){
  var el=document.getElementById("b-status");
  if(el&&B) el.innerHTML=statusPanelHtml();
}
/* ---- 戦闘描画（渓流の一手イメージ準拠） ---- */
function renderBattle(){
  var app=$("app");
  var cells="";
  var order=[]; for(var yy=0;yy<ROWS;yy++) for(var xx=0;xx<COLS;xx++) order.push([xx,yy]);
  order.sort(function(a,b){ return (a[0]+a[1])-(b[0]+b[1]); });
  order.forEach(function(pos){
    var x=pos[0], y=pos[1];
    var u=unitAt(x,y);
    var isTgt=B.targets.some(function(tt){return tt.x===x&&tt.y===y;});
    var isMoveCell = B.mode==="move" && B.targets.indexOf(x+","+y)>=0;
    var blocked = isBlockedTile(x,y) && !u;
    var inConfirm = B.confirm && Math.abs(x-B.confirm.x)<=1 && Math.abs(y-B.confirm.y)<=1;
    var cls="iso-cell t-"+TERRAIN[tIdx(x,y)];
    if(isMoveCell) cls+=" is-move"; else if((isTgt&&B.mode==="target")||inConfirm) cls+=" is-target";
    if(blocked) cls+=" is-blocked";
    if(B.sel&&u===B.sel) cls+=" is-sel";
    var left, top, z;
    var lt=cellLeftTop(x,y); left=lt.left.toFixed(2); top=lt.top.toFixed(2); z=lt.z;
    /* 段差（崖面）の側面：マス自体を持ち上げたうえで、手前2方向の隣マスとの
       高さ差ぶんだけ、高い側のマスの下辺から崖面を垂らす。段差の位置・大きさは
       高さデータそのものと一致する（差0なら面は出ない）。回転時も隣接判定は
       表示座標→unrotXY で戻して行う。盤外は段差なし（自マスと同じ高さ）として、
       盤の縁に壁が立たないようにする。
       崖面の長さは高さ差×ELEV_PCT（盤面高%）をマス高（2*ISO_SY%）で割った割合。 */
    var rp=rotXY(x,y), drx=rp[0], dry=rp[1], dRW=rp[2], dRD=rp[3];
    function dispH(nx,ny){ if(nx<0||ny<0||nx>=dRW||ny>=dRD) return lt.h; var q=unrotXY(nx,ny); return heightAt(q[0],q[1]); }
    function blkSpan(cls, drop){
      var f=drop*ELEV_PCT/(2*ISO_SY);
      if(f<0.04) return "";
      f=Math.min(1.15, f);
      var bh=50+100*f, p1=(50/bh*100), p2=(100*f/bh*100);
      /* 形そのものを「箱の側面」から崩す（質感だけでは直方体に見えたため）：
         - 稜線（上辺）に中間点2つを入れ、マスごとの決定的ハッシュで上下に
           ずらして直線でなくす（端点は隣マスとの整合のため固定）。
         - 側辺は中腹（落差の55%付近）で内側へ3.2%寄せ、面の下半分が
           すぼまる台形寄りの輪郭にする（平行四辺形＝箱の幾何を崩す）。
         - 下端は従来どおり中間点で緩やかに垂れる曲線にする。
         - 大きな段差（f>0.5＝高さ差およそ7以上）では .bench を付け、
           CSS側の帯で面の中間に土の斜面（なだらかな段）を挟む。
         高さの垂れ量（落差の大きさ）自体は従来どおり高さデータと一致する。 */
      var hs=(x*31+y*17+(cls==="blk-l"?7:13))%10/10; /* 0〜0.9 */
      function sag(t){ return (2.4+hs*1.5)*Math.sin(Math.PI*t); }
      function pt(px,py){ return px+"% "+(Math.round(py*10)/10)+"%"; }
      var r1=(cellHash(x*3+(cls==="blk-l"?101:211), y*5+57)-0.5)*4.4;
      var r2=(cellHash(x*7+(cls==="blk-l"?307:409), y*3+719)-0.5)*4.4;
      var poly;
      if(cls==="blk-l"){ /* 稜線：(0,0) → (100,p1)／下端：(0,p2) → (100,100) */
        poly="0 0,"+pt(33,p1*0.33+r1)+","+pt(66,p1*0.66+r2)+","+pt(100,p1)+","+pt(96.8,p1+(100-p1)*0.55)+","+pt(100,100)+","+pt(64,p2+(100-p2)*0.64+sag(0.64))+","+pt(34,p2+(100-p2)*0.34+sag(0.34))+","+pt(0,p2)+","+pt(3.2,p2*0.45);
      } else { /* 稜線：(0,p1) → (100,0)／下端：(0,100) → (100,p2) */
        poly=pt(0,p1)+","+pt(33,p1*0.67+r1)+","+pt(66,p1*0.34+r2)+",100% 0,"+pt(96.8,p2*0.55)+","+pt(100,p2)+","+pt(66,100+(p2-100)*0.66+sag(0.66))+","+pt(32,100+(p2-100)*0.32+sag(0.32))+","+pt(0,100)+","+pt(3.2,p1+(100-p1)*0.45);
      }
      var pos = cls==="blk-l" ? "left:0" : "left:50%";
      /* マスごとの明暗差は小さく抑える（差が大きいと側面が別々のブロックに
         見える）。輪郭には僅かなぼかしを入れ、水彩の絵へ溶け込ませる。 */
      var br=(0.97+((x*7+y*13+(cls==="blk-l"?0:3))%5)*0.015).toFixed(3);
      return '<span class="blk '+cls+(f>0.5?" bench":"")+'" style="'+pos+';top:50%;width:50%;height:'+bh.toFixed(1)+'%;clip-path:polygon('+poly+');filter:brightness('+br+') blur(0.5px)"></span>';
    }
    var blocks = blkSpan("blk-l", lt.h-dispH(drx,dry+1)) + blkSpan("blk-r", lt.h-dispH(drx+1,dry));
    var inner=blocks+'<span class="diamond"></span><span class="hit"></span>';
    if(blocked) inner+='<span class="blocked-x">×</span>';
    if(u){
      var isCur = B.sel===u && !B.over;
      inner+='<span class="unit '+(u.side==="e"?"enemy":"")+(u.god?" god":"")+(u.alive?"":" dead")+(u.acted&&u.side==="a"?" acted":"")+'">'
        +(isCur?'<span class="u-active">👉</span>':"")
        +'<span class="u-shadow"></span>'
        +'<span class="u-art">'+unitArt(u)+'</span>'
        +'<span class="u-ring"></span>'
        +'<span class="u-dir" style="transform:translate(-50%,50%) rotate('+screenDegForDir(u.faceDir||(u.side==="e"?[0,1]:[0,-1])).toFixed(0)+'deg) translateY(calc(var(--k)*-15))"></span>'
        +'<span class="u-hpbar"><i class="'+(u.hp/u.maxhp<0.3?"low":"")+'" style="width:'+Math.max(0,Math.round(u.hp/u.maxhp*100))+'%"></i></span>'
        +'<span class="u-nameplate">'+esc(u.name)+((u.side==="e"&&u.art&&ENEMY_PROFILES[u.art])?' <span style="color:#ffb59d;font-size:.82em">'+ENEMY_PROFILES[u.art].label+'</span>':"")+'</span></span>';
    }
    cells+='<button class="'+cls+'" style="left:'+left+'%;top:'+top+'%;z-index:'+z+'" data-cell="'+x+','+y+'" aria-label="'+x+','+y+'">'+inner+'</button>';
  });
  /* 敵の体力は盤面上の名札／HPバーで示す（画面中央上部の一覧表示は置かない） */
  /* skill targeting bar (range-confirm reference) */
  var skillbar="";
  if(!B.over && B.mode==="target" && B.pendingSkill){
    var sk=B.pendingSkill.sk;
    skillbar='<div class="b-skillbar"><span class="sk-nm">'+esc(sk.n)+'</span><span>消費神力 '+sk.mp+'</span></div>';
  }
  /* minimap（表示の回転に合わせて並べる。高台は h クラス） */
  var _dims=rotXY(0,0), RW=_dims[2], RD=_dims[3];
  var mini="";
  for(var rry=0;rry<RD;rry++) for(var rxx=0;rxx<RW;rxx++){ var lp=unrotXY(rxx,rry); var mx=lp[0], my=lp[1]; var mu=unitAt(mx,my); var mc=TERRAIN[tIdx(mx,my)]==="water"?"w":TERRAIN[tIdx(mx,my)]==="rock"?"r":TERRAIN[tIdx(mx,my)]==="high"?"h":""; if(mu) mc=mu.side==="a"?"a":"e"; mini+='<i class="'+mc+'"></i>'; }
  var foesLeft=B.foes.filter(function(f){return f.alive;}).length;

/* ============ 戦闘エフェクト再生（FXQ の見た目イベントを DOM に流す） ============
   1アクション分が数百ミリ秒で終わる軽い CSS アニメーションのみ。
   入力はブロックしない（演出と並行して次の操作を受け付ける）。 */
function playFX(){
  if(!FXQ.length) return;
  var q=FXQ; FXQ=[];
  var board=document.querySelector(".iso-board");
  if(!board) return;
  var rect=board.getBoundingClientRect();
  function cellEl(x,y){ return board.querySelector('[data-cell="'+x+','+y+'"]'); }
  function unitEl(x,y){ var c=cellEl(x,y); return c?c.querySelector(".unit"):null; }
  function floater(x,y,text,cls){
    var d=document.createElement("div");
    d.className="fx-float "+cls; d.textContent=text;
    var c=cellCenter(x,y);
    d.style.left=c.cx+"%";
    d.style.top=(c.cy+1.5)+"%";
    board.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },1050);
  }
  function flash(el,cls,ms){
    if(!el) return;
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    setTimeout(function(){ el.classList.remove(cls); },ms);
  }
  q.forEach(function(ev){
    if(ev.t==="slide"){
      var u=unitEl(ev.x,ev.y); if(!u||!rect.width) return;
      var ca=cellCenter(ev.fx,ev.fy), cb=cellCenter(ev.x,ev.y);
      /* ユニットの transform は盤面ローカル座標系なので、%→px 変換はレイアウト寸法で行う（カメラの拡縮に影響されない） */
      var dx=(ca.cx-cb.cx)/100*board.offsetWidth;
      var dy=(ca.cy-cb.cy)/100*board.offsetHeight;
      if(!dx&&!dy) return;
      u.style.transition="none";
      u.style.transform="translate(calc(-50% + "+Math.round(dx)+"px), "+Math.round(dy)+"px)";
      void u.offsetWidth;
      u.style.transition="transform .3s ease";
      u.style.transform="";
      setTimeout(function(){ u.style.transition=""; },360);
    } else if(ev.t==="dmg"){
      flash(unitEl(ev.sx,ev.sy),"fx-lunge",320);
      flash(unitEl(ev.x,ev.y),"fx-hit",400);
      floater(ev.x,ev.y,"-"+ev.amt,"dmg");
      if(ev.died) flash(unitEl(ev.x,ev.y),"fx-die",820);
    } else if(ev.t==="heal"){
      flash(unitEl(ev.x,ev.y),"fx-heal",680);
      floater(ev.x,ev.y,(typeof ev.amt==="number"?"+"+ev.amt:ev.amt),ev.revive?"revive":"heal");
    } else if(ev.t==="miss"){
      floater(ev.x,ev.y,"MISS","miss");
    }
  });
}
/* マスタップ処理（盤面のどの経路でタップされても、最終的にこの関数へ集約する） */
function onCellTap(x,y){
    if(!B||B.over) return;
    var u=unitAt(x,y);
    B.focus={x:x,y:y};
    /* 左のステータス枠は「最後にタップしたキャラ」を表示する（戦闘不能者も対象）。
       行動フロー上のタップ処理（対象選択など）はこの後の従来処理が優先される。 */
    var fu=u||unitAtIncludingDead(x,y);
    if(fu){ B.focusUnit=fu; updateStatusPanel(); }
    if(B.mode==="select"){ if(u&&u.side==="a") selectUnit(u); return; }
    if(!B.sel) return;
    if(B.mode==="move"){
      /* 移動は「移動」ボタンを押したあとだけ起きる。自分のマス＝移動を取りやめて
         移動前メニューへ戻る。範囲外のマスはステータス表示の切替だけ（上の処理）。 */
      if(u===B.sel){ cancelMoveSelect(); return; }
      if(B.targets.indexOf(x+","+y)>=0){ B.preMove={x:B.sel.x,y:B.sel.y,face:(B.sel.faceDir?B.sel.faceDir.slice():null)}; fxPush({t:"slide",fx:B.sel.x,fy:B.sel.y,x:x,y:y}); setFacingDelta(B.sel,x-B.sel.x,y-B.sel.y); B.sel.x=x; B.sel.y=y; B.moved=true; B.focus={x:x,y:y}; afterMove(); }
      return;
    }
    /* mode="action"（移動前・移動後とも）では盤面タップで移動しない：
       ステータス枠の表示切替だけを行い、行動はコマンドボタンから選ぶ */
    if(B.mode==="target"){
      if(B.pendingSkill){
        var ok=B.targets.some(function(t){return t.x===x&&t.y===y;});
        if(ok){
          if(B.pendingSkill.sk.r==="area" && !B.confirm){ B.confirm={x:x,y:y}; renderBattle(); return; }
          if(B.pendingSkill.sk.r==="s"){ B.predict={kind:"skill",x:x,y:y}; renderBattle(); return; } /* 単体技は実行前に戦闘予測パネルを出す */
          executeSkill(x,y);
        }
        return;
      }
      if(u&&u.side==="e"&&dist(B.sel,u)<=1){ B.predict={kind:"atk",x:u.x,y:u.y}; renderBattle(); } /* 通常攻撃も実行前に戦闘予測パネルを出す */
      return;
    }
}
function bindBattle(){
  document.querySelectorAll("[data-cell]").forEach(function(c){
    c.addEventListener("mouseenter", function(){
      if(!B) return;
      var p=c.dataset.cell.split(","); var x=parseInt(p[0]), y=parseInt(p[1]);
      B.focus={x:x,y:y};
      var ti=terrainInfo(x,y); var tn=$("t-name"), tb=$("t-body");
      if(tn) tn.textContent=ti.name;
      if(tb) tb.innerHTML="X"+String(x).padStart(2,"0")+" Y"+String(y).padStart(2,"0")+"<br>高さ "+ti.h+"<br>"+ti.cost+"<br>"+ti.note;
    });
  });
  /* タップ判定は盤面全体で受ける：アイソメ盤面はセル同士が重なり合うため、
     セル単位のクリックでは見た目の下半分が隣のセルに取られてしまう。
     タップ座標から最も近いマスの中心へ吸着させ、指で確実に押せるようにする。
     （セルの当たり判定自体も .hit で見た目より広げてある） */
  var board=document.querySelector(".iso-board");
  if(board) board.addEventListener("click", function(ev){
    if(!B||B.over) return;
    if(Date.now()<CAM.suppressTapUntil) return; /* ドラッグ（スクロール）の直後のクリックはタップとして扱わない */
    var cellBtn=(ev.target&&ev.target.closest)?ev.target.closest("[data-cell]"):null;
    if(ev.detail===0&&cellBtn){ var kp=cellBtn.dataset.cell.split(","); onCellTap(parseInt(kp[0]),parseInt(kp[1])); return; } /* キーボード操作 */
    var r=board.getBoundingClientRect(); if(!r.width) return;
    var px=(ev.clientX-r.left)/r.width*100, py=(ev.clientY-r.top)/r.height*100;
    var best=null, bd=1e9;
    for(var yy=0;yy<ROWS;yy++) for(var xx=0;xx<COLS;xx++){
      var cc=cellCenter(xx,yy);
      var dx=(px-cc.cx)/6.5, dy=(py-cc.cy)/5.3, d=dx*dx+dy*dy;
      if(d<bd){ bd=d; best=[xx,yy]; }
    }
    if(best&&bd<=1.9) onCellTap(best[0],best[1]);
  });
  var desel=$("btn-deselect"); if(desel) desel.addEventListener("click", function(){ if(B.cur){ B.sel=B.cur; B.mode="action"; B.targets=[]; } renderBattle(); });
  var mvb=$("btn-move"); if(mvb) mvb.addEventListener("click", startMove);
  var atk=$("btn-atk"); if(atk) atk.addEventListener("click", chooseAttack);
  var skb=$("btn-skills"); if(skb) skb.addEventListener("click", function(){ B.showSkills=true; renderBattle(); });
  var bsk=$("btn-backskills"); if(bsk) bsk.addEventListener("click", function(){ B.showSkills=false; renderBattle(); });
  var wait=$("btn-wait"); if(wait) wait.addEventListener("click", waitUnit);
  var fok=$("btn-face-ok"); if(fok) fok.addEventListener("click", confirmFacing);
  document.querySelectorAll("[data-face]").forEach(function(b){ b.addEventListener("click", function(){ var p=b.dataset.face.split(","); B.faceSel=[parseInt(p[0]),parseInt(p[1])]; renderBattle(); }); });
  var cmv=$("btn-cancelmove"); if(cmv) cmv.addEventListener("click", undoMove);
  var mvback=$("btn-move-back"); if(mvback) mvback.addEventListener("click", unifiedBack);
  var ret=$("btn-retreat"); if(ret) ret.addEventListener("click", function(){ B.retreatAsk=true; renderBattle(); });
  var retok=$("btn-retreat-ok"); if(retok) retok.addEventListener("click", retreatBattle);
  var retno=$("btn-retreat-no"); if(retno) retno.addEventListener("click", function(){ B.retreatAsk=false; renderBattle(); });
  var cancelFn=function(){ /* 対象選択の「もどる」は行動メニューへ戻す（移動前／後は B.moved で自動で切り替わる） */
    B.mode="action"; B.pendingSkill=null; B.confirm=null; B.predict=null; B.showSkills=false;
    B.targets=[];
    renderBattle(); };
  var pok=$("btn-predict-ok"); if(pok) pok.addEventListener("click", executePredicted);
  var pno=$("btn-predict-no"); if(pno) pno.addEventListener("click", function(){ B.predict=null; renderBattle(); }); /* キャンセル＝対象選択に戻る（移動の巻き戻しはしない） */
  var cancel=$("btn-cancel"); if(cancel) cancel.addEventListener("click", cancelFn);
  var cancel2=$("btn-cancel2"); if(cancel2) cancel2.addEventListener("click", cancelFn);
  var cok=$("btn-confirm-ok"); if(cok) cok.addEventListener("click", function(){ var cx=B.confirm.x, cy=B.confirm.y; executeSkill(cx,cy); });
  var cno=$("btn-confirm-no"); if(cno) cno.addEventListener("click", function(){ B.confirm=null; renderBattle(); });
  var endp=$("btn-endphase"); if(endp) endp.addEventListener("click", function(){ enemyPhase(); renderBattle(); });
  var rotb=$("btn-rot"); if(rotb) rotb.addEventListener("click", function(){
    /* 回転軸は「今画面中央に映っている地点」：回転前に画面中央の論理座標
       （小数マス）を求め、回転後の投影で同じ地点が画面中央に来るよう
       カメラをずらす。視点が飛ばず、その場で盤面だけが回る。
       回転後に盤面がはみ出す場合は renderBattle→applyCam→clampCam が
       従来のクランプ範囲に収める。ズームの軸（選択地点）は変更しない。 */
    var e=camEls();
    var piv=(e.stage&&e.board)?stageCenterLogical():null;
    var vw=e.stage?e.stage.clientWidth:0, vh=e.stage?e.stage.clientHeight:0;
    B.rot=((B.rot||0)+1)%4;
    if(piv&&e.board){
      var nc=logicalCenterPct(piv.x, piv.y);
      CAM.tx=vw/2-(e.board.offsetLeft + nc.cx/100*e.board.offsetWidth)*CAM.z;
      CAM.ty=vh/2-(e.board.offsetTop + nc.cy/100*e.board.offsetHeight)*CAM.z;
    }
    renderBattle();
  });
  var zin=$("btn-zoomin"); if(zin) zin.addEventListener("click", function(){ zoomAtSelection(CAM.z*1.25); });
  var zout=$("btn-zoomout"); if(zout) zout.addEventListener("click", function(){ zoomAtSelection(CAM.z/1.25); });
  var fitb=$("btn-fit"); if(fitb) fitb.addEventListener("click", function(){ fitCameraToBoard(true); });
  bindCameraInput();
  var leave=$("btn-leave"); if(leave) leave.addEventListener("click", leaveBattle);
  document.querySelectorAll("[data-bskill]").forEach(function(b){ b.addEventListener("click", function(){ var p=b.dataset.bskill.split("-"); chooseSkill(p[0], parseInt(p[1])); }); });
}
/* ============ カメラ入力（ドラッグでパン／ピンチ・ホイールでズーム） ============
   タップとドラッグは移動量で判定する：10px 未満の動きはタップ（通常の click に任せ）、
   それ以上はドラッグとしてパンし、直後の click を CAM.suppressTapUntil で無効化する。
   メニューやパネルの上から始まった操作はパンにしない。 */
function bindCameraInput(){
  var stage=document.querySelector(".b-stage");
  if(!stage||stage._camBound) return;
  stage._camBound=true;
  var pts=new Map();
  var drag=null; /* {moved,lastX,lastY} */
  var pinch=null; /* {d0,z0,mx,my} */
  function stageXY(ev){ var r=stage.getBoundingClientRect(); return [ev.clientX-r.left, ev.clientY-r.top]; }
  stage.addEventListener("pointerdown", function(ev){
    if(ev.target.closest && ev.target.closest(".b-menu,.b-terrain,.b-predict,.b-predict-backdrop,.b-result,.b-skillbar,.b-move-back")) return;
    pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if(pts.size===1){ var p=stageXY(ev); drag={moved:false,lastX:p[0],lastY:p[1],totX:0,totY:0}; pinch=null; }
    else if(pts.size===2){
      var arr=Array.from(pts.values());
      var mx=(arr[0][0]+arr[1][0])/2, my=(arr[0][1]+arr[1][1])/2;
      var r=stage.getBoundingClientRect();
      pinch={ d0:Math.hypot(arr[0][0]-arr[1][0], arr[0][1]-arr[1][1])||1, z0:CAM.z, mx:mx-r.left, my:my-r.top };
      drag=null;
      CAM.suppressTapUntil=Date.now()+300;
    }
    try{ stage.setPointerCapture(ev.pointerId); }catch(e){}
  });
  stage.addEventListener("pointermove", function(ev){
    if(!pts.has(ev.pointerId)) return;
    pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if(pinch && pts.size===2){
      var arr=Array.from(pts.values());
      var d=Math.hypot(arr[0][0]-arr[1][0], arr[0][1]-arr[1][1])||1;
      var r=stage.getBoundingClientRect();
      var mx=(arr[0][0]+arr[1][0])/2-r.left, my=(arr[0][1]+arr[1][1])/2-r.top;
      CAM.tx+=mx-pinch.mx; CAM.ty+=my-pinch.my; /* 中点の移動ぶんパン */
      pinch.mx=mx; pinch.my=my;
      zoomAtSelection(pinch.z0*d/pinch.d0); /* 拡縮そのものは選択地点を中心に行う */
      CAM.suppressTapUntil=Date.now()+300;
      return;
    }
    if(drag){
      var p=stageXY(ev);
      var dx=p[0]-drag.lastX, dy=p[1]-drag.lastY;
      drag.lastX=p[0]; drag.lastY=p[1];
      drag.totX+=dx; drag.totY+=dy;
      if(!drag.moved){
        if(Math.hypot(drag.totX,drag.totY)<10) return; /* 10px 未満はタップとして扱い、パンしない（タップの微小なブレを許容） */
        drag.moved=true;
      }
      CAM.tx+=dx; CAM.ty+=dy;
      applyCam(false);
      CAM.suppressTapUntil=Date.now()+300;
    }
  });
  function endPointer(ev){
    pts.delete(ev.pointerId);
    if(pts.size<2) pinch=null;
    if(pts.size===0){ if(drag&&drag.moved) CAM.suppressTapUntil=Date.now()+250; drag=null; }
  }
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", endPointer);
  stage.addEventListener("wheel", function(ev){
    ev.preventDefault();
    var f=ev.deltaY<0?1.12:1/1.12;
    zoomAtSelection(CAM.z*f); /* ホイールも選択地点を中心に拡縮する */
  }, {passive:false});
}
</script>
<script>
"use strict";
/* PWA: Service Worker 登録（オフライン起動・ホーム画面追加用）。
   対応していない環境や埋め込み表示で登録できない場合は、そのまま通常表示で遊べます。 */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("assets/sw.js").then(function (reg) {
      if (reg && reg.update) { reg.update(); }
    }).catch(function () { /* 登録できなくてもゲームはそのまま動作します */ });
  });
}
</script>
